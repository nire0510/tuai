name: Package Check

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  pack:
    name: Verify npm package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package contents
        run: npm pack --dry-run
