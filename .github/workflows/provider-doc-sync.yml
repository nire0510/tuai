name: Provider Docs Sync

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '30 3 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Verify provider docs and open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skip when Claude token is missing
        if: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' }}
        run: |
          echo "CLAUDE_CODE_OAUTH_TOKEN is not set; skipping provider sync run."

      - name: Run provider-doc-sync skill
        if: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npx -y @anthropic-ai/claude-code \
            --append-system-prompt-file .claude/skills/provider-doc-sync/SKILL.md \
            -p "$(cat .claude/skills/provider-doc-sync/TASK_PROMPT.md)" \
            --max-turns 50 \
            --permission-mode bypassPermissions \
            --output-format text

      - name: Check whether providers changed
        id: changes
        run: |
          if git diff --quiet -- providers/; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/provider-doc-sync
          delete-branch: true
          commit-message: "chore(providers): sync CLI metadata with upstream docs"
          title: "chore(providers): sync CLI metadata with upstream docs"
          body: |
            Automated provider metadata refresh.

            This PR was generated by the provider-doc-sync skill.
            It checks provider `reference` URLs and updates stale command/flag/slash-command entries.
          add-paths: |
            providers/*.js
